<div class="container mt-5">
  <h2>User Registration Form</h2>
  <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)">
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="fullName" class="form-control" 
             [(ngModel)]="user.fullName" required minlength="3" #fullName="ngModel">
      <small class="text-danger" *ngIf="fullName.invalid && fullName.touched">
        Name is required (min 3 chars)
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" class="form-control" 
             [(ngModel)]="user.email" required email #email="ngModel">
      <small class="text-danger" *ngIf="email.invalid && email.touched">
        Enter a valid email address
      </small>
    </div>

    <div class="form-group">
      <label>Gender</label><br>
      <input type="radio" name="gender" value="Male" [(ngModel)]="user.gender"> Male
      <input type="radio" name="gender" value="Female" [(ngModel)]="user.gender"> Female
    </div>

    <div class="form-group">
      <label>Country</label>
      <select name="country" class="form-control" [(ngModel)]="user.country" required>
        <option value="" disabled>Select Country</option>
        <option *ngFor="let c of countries">{{ c }}</option>
      </select>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="!userForm.valid">Submit</button>
    <button class="btn btn-secondary ml-2" type="button" (click)="onReset(userForm)">Reset</button>
  </form>

  <hr>
  <div *ngIf="submitted">
    <h4>Submitted Data:</h4>
    <pre>{{ user | json }}</pre>
  </div>
</div>

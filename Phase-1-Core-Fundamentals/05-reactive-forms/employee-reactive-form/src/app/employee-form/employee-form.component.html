<div class="container mt-4">
  <h2>Employee Registration (Reactive Form)</h2>
  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Full Name</label>
      <input formControlName="fullName" class="form-control" placeholder="Enter name" />
      <small *ngIf="employeeForm.get('fullName').touched && employeeForm.get('fullName').invalid" class="text-danger">
        Name is required (min 3 chars)
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input formControlName="email" class="form-control" placeholder="Enter email" />
      <small *ngIf="employeeForm.get('email').touched && employeeForm.get('email').invalid" class="text-danger">
        Valid email is required
      </small>
    </div>

    <div class="form-group">
      <label>Department</label>
      <select formControlName="department" class="form-control">
        <option value="">Select Department</option>
        <option>Engineering</option>
        <option>HR</option>
        <option>Finance</option>
      </select>
      <small *ngIf="employeeForm.get('department').touched && employeeForm.get('department').invalid" class="text-danger">
        Department is required
      </small>
    </div>

    <div formArrayName="skills" class="mt-3">
      <h4>Skills</h4>
      <div *ngFor="let skill of skills.controls; let i = index" [formGroupName]="i" class="card p-3 mb-2">
        <div class="form-row">
          <div class="col">
            <input formControlName="skillName" class="form-control" placeholder="Skill Name" />
          </div>
          <div class="col">
            <input formControlName="experience" type="number" class="form-control" placeholder="Years of Experience" />
          </div>
          <div class="col-auto">
            <button class="btn btn-danger" type="button" (click)="removeSkill(i)">Remove</button>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" type="button" (click)="addSkill()">+ Add Skill</button>
    </div>

    <button class="btn btn-success mt-3" type="submit">Submit</button>
  </form>
</div>

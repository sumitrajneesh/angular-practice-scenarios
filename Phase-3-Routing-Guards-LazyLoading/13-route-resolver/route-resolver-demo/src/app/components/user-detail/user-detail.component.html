<div class="container mt-4">
  <h3>User Details</h3>
  <div *ngIf="user">
    <p><strong>Name:</strong> {{ user.name }}</p>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Phone:</strong> {{ user.phone }}</p>
  </div>
  <div *ngIf="!user">
    <p>Loading user details...</p>
  </div>
</div>

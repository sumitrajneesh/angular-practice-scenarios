<div class="container mt-4">
  <h3>User List</h3>
  <ul class="list-group">
    <li *ngFor="let user of users" class="list-group-item d-flex justify-content-between align-items-center">
      {{ user.name }}
      <button class="btn btn-primary btn-sm" (click)="viewDetails(user.id)">View Details</button>
    </li>
  </ul>
</div>

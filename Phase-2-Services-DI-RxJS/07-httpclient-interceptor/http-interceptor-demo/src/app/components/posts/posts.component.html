<div class="container mt-4">
  <h3>Posts</h3>
  <div *ngIf="!posts.length" class="text-muted">Loading posts...</div>
  <ul *ngIf="posts.length" class="list-group">
    <li *ngFor="let post of posts" class="list-group-item">
      <strong>{{ post.title }}</strong>
      <p>{{ post.body }}</p>
    </li>
  </ul>
</div>

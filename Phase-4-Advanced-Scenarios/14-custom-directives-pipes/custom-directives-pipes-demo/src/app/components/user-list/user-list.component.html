<h2>User List</h2>

<input type="text" [(ngModel)]="searchText" placeholder="Search by name" />

<ul>
  <li *ngFor="let user of users | filter:searchText" [appHighlight]="'lightyellow'">
    <strong>{{ user.name }}</strong> - {{ user.description | truncate:40 }}
  </li>
</ul>

<p *appUnless="isVisible">This message shows only when isVisible is false.</p>
